name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        run: python3 scripts/validate_skill.py
      - name: Check provider configuration CLI
        run: python3 scripts/configure_image_provider.py list
